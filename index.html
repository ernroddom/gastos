<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<title>Gastos</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192-v3.png">
<link rel="apple-touch-icon" href="./apple-touch-icon-v3.png">
<style>
  :root {
    --bg: #111214; --panel: #1A1C1F; --panel2: #23262A; --line: #2E3237;
    --text: #F2F2EF; --muted: #9AA0A6; --accent: #59A14F; --danger: #E15759;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 84px); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 12px 16px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 4px; }
  header > div { display: flex; gap: 4px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  .icon-btn { background: none; border: 0; width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center; cursor: pointer; color: var(--muted); }
  .icon-btn:active { background: var(--panel2); }
  .month { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 2px; }
  .month .name { font-size: 17px; font-weight: 600; }
  .total { font-size: 40px; font-weight: 750; letter-spacing: -1px; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 13px; }
  .card { background: var(--panel); border-radius: var(--radius); padding: 14px; margin-top: 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .cat-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin-bottom: 10px; }
  .cat-row .lbl { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .cat-row .amt { font-size: 15px; font-variant-numeric: tabular-nums; text-align: right; }
  .cat-row .bar { grid-column: 1 / -1; height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .cat-row .bar i { display: block; height: 100%; border-radius: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .pct { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .chart { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; align-items: end; height: 140px; }
  .chart .col { display: flex; flex-direction: column-reverse; height: 100%; cursor: pointer; border-radius: 4px; overflow: hidden; }
  .chart .col .seg { width: 100%; }
  .chart .col.sel { outline: 2px solid var(--text); outline-offset: 2px; }
  .chart-lbls { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; margin-top: 6px; }
  .chart-lbls span { font-size: 11px; color: var(--muted); text-align: center; text-transform: uppercase; }
  .chart-lbls span.sel { color: var(--text); font-weight: 700; }
  .day { font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  .day:first-child { margin-top: 0; }
  .mov { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .day + .mov { border-top: 0; }
  .mov .info { flex: 1; min-width: 0; }
  .mov .c { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mov .k { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mov .a { font-variant-numeric: tabular-nums; font-size: 15px; }
  .mov .badge { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center;
    font-size: 13px; font-weight: 700; color: #111; }
  .empty { color: var(--muted); text-align: center; padding: 18px 0; font-size: 14px; }
  .add-btn { background: var(--accent); color: #0d150c; }
  .add-btn:active { background: var(--accent); filter: brightness(.9); }
  .mic-wrap { display: grid; place-items: center; padding: 18px 0 6px; }
  .mic-ring { width: 96px; height: 96px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: #0d150c;
    animation: pulse 1.4s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(89,161,79,.55); } 100% { box-shadow: 0 0 0 26px rgba(89,161,79,0); } }
  .heard { min-height: 3em; text-align: center; font-size: 18px; margin: 16px 0 4px; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(17,18,20,.94);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: 1fr 1fr; padding: 6px 0 calc(env(safe-area-inset-bottom) + 6px); }
  .tabbar button { background: none; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center;
    gap: 3px; font-size: 11px; font-weight: 600; padding: 6px 0; cursor: pointer; }
  .tabbar button.on { color: var(--text); }
  .tabbar button.on svg { color: var(--accent); }
  .mini { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 0 0; }
  .mini b { font-size: 22px; font-variant-numeric: tabular-nums; }
  /* hoja inferior */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-radius: 22px 22px 0 0;
    padding: 10px 16px calc(env(safe-area-inset-bottom) + 16px); transform: translateY(105%); transition: transform .25s ease, visibility .25s; visibility: hidden;
    z-index: 11; max-height: 92vh; overflow-y: auto; max-width: 560px; margin: 0 auto; }
  .sheet.open { transform: none; visibility: visible; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
  .sheet h3 { margin: 4px 0 12px; font-size: 18px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: .6px; }
  input, textarea { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 16px; outline: none; }
  input:focus, textarea:focus { border-color: var(--muted); }
  .amount-in { font-size: 34px; font-weight: 700; text-align: center; padding: 10px; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--panel2); border-radius: 999px; padding: 8px 12px; font-size: 14px;
    display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .chip.on { color: #111; font-weight: 600; border-color: transparent; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { width: 100%; border: 0; border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 650; cursor: pointer; margin-top: 16px; }
  .btn.primary { background: var(--accent); color: #0d150c; }
  .btn.ghost { background: var(--panel2); }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: .5; }
  .err { color: var(--danger); font-size: 14px; margin-top: 10px; min-height: 1em; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 84px); transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: .2s; z-index: 20; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .loading { height: 3px; background: linear-gradient(90deg, transparent, var(--accent), transparent); background-size: 200% 100%;
    animation: ld 1s linear infinite; position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: none; }
  .loading.on { display: block; }
  @keyframes ld { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .setup p { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="loading" id="loading"></div>

<!-- Configuración inicial -->
<div class="wrap setup hidden" id="setup">
  <header><h1>Gastos</h1></header>
  <div class="card">
    <h2>Conectar con tu hoja</h2>
    <p>Esto solo se pide la primera vez y se guarda en este móvil, separado de cualquier otra app.</p>
    <label for="cfgUrl">URL del script (aplicación web)</label>
    <input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="cfgId">ID de la hoja de gastos</label>
    <input id="cfgId" type="text" placeholder="1o_q44_UA_..." autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn primary" id="cfgSave">Conectar</button>
    <button class="btn ghost hidden" id="cfgCancel">Cancelar</button>
    <div class="err" id="cfgErr"></div>
  </div>
</div>

<!-- App -->
<div class="wrap hidden" id="app">
  <header>
    <h1 id="title">Resumen</h1>
    <div>
      <button class="icon-btn" id="btnReload" aria-label="Recargar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="btnCfg" aria-label="Ajustes">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="icon-btn hidden" id="btnMic" aria-label="Dictar gasto">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>
      </button>
      <button class="icon-btn add-btn hidden" id="btnAdd" aria-label="Añadir gasto">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <div class="month">
    <button class="icon-btn" id="prev" aria-label="Mes anterior">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="name" id="monthName"></div>
    <button class="icon-btn" id="next" aria-label="Mes siguiente">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <!-- Pestaña Resumen -->
  <section id="tabResumen">
    <div class="total" id="total">–</div>
    <div class="sub" id="totalSub"></div>
    <div class="card">
      <h2>Por categoría</h2>
      <div id="cats"></div>
    </div>
    <div class="card">
      <h2 id="yearTitle">Año</h2>
      <div class="chart" id="chart"></div>
      <div class="chart-lbls" id="chartLbls"></div>
      <div class="sub" id="yearSub" style="margin-top:12px"></div>
    </div>
  </section>

  <!-- Pestaña Movimientos -->
  <section id="tabMovs" class="hidden">
    <div class="mini"><span class="sub" id="movCount"></span><b id="movTotal"></b></div>
    <div class="card">
      <div id="movs"></div>
    </div>
  </section>
</div>

<nav class="tabbar hidden" id="tabbar">
  <button id="tbResumen" class="on">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    Resumen
  </button>
  <button id="tbMovs">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
    Movimientos
  </button>
</nav>

<!-- Hoja: nuevo gasto -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheetNew" role="dialog" aria-label="Nuevo gasto">
  <div class="grab"></div>
  <h3>Nuevo gasto</h3>
  <div class="hint" id="fAviso" style="text-align:left;margin:-4px 0 12px"></div>
  <input class="amount-in" id="fImporte" inputmode="decimal" placeholder="0,00 €" autocomplete="off">
  <label>Categoría</label>
  <div class="chips" id="fCats"></div>
  <label for="fConcepto">Concepto</label>
  <input id="fConcepto" type="text" placeholder="Mercadona, gasolina, cena…" autocomplete="off">
  <div class="row2">
    <div>
      <label for="fFecha">Fecha</label>
      <input id="fFecha" type="date">
    </div>
    <div>
      <label for="fNotas">Notas</label>
      <input id="fNotas" type="text" placeholder="Opcional" autocomplete="off">
    </div>
  </div>
  <button class="btn primary" id="fSave">Guardar</button>
  <div class="err" id="fErr"></div>
</div>

<!-- Hoja: dictado -->
<div class="sheet" id="sheetMic" role="dialog" aria-label="Dictar gasto">
  <div class="grab"></div>
  <h3>Dicta el gasto</h3>
  <div class="mic-wrap"><div class="mic-ring">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>
  </div></div>
  <div class="heard" id="micText">Escuchando…</div>
  <div class="hint">Por ejemplo: «23,50 en Mercadona», «gasolina 40 euros ayer» o «cena en restaurante 44 euros el día 14».</div>
  <button class="btn primary" id="micDone">Listo</button>
  <button class="btn ghost" id="micCancel">Cancelar</button>
  <div class="err" id="micErr"></div>
</div>

<!-- Hoja: detalle / borrar -->
<div class="sheet" id="sheetDel" role="dialog" aria-label="Detalle del gasto">
  <div class="grab"></div>
  <h3 id="dTitle"></h3>
  <div class="sub" id="dSub"></div>
  <button class="btn danger" id="dDelete">Borrar este gasto</button>
  <button class="btn ghost" id="dClose">Cerrar</button>
  <div class="err" id="dErr"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  // Claves propias de esta app: no comparten nada con otras apps del mismo dominio
  const K = { url: 'gastos.scriptUrl', id: 'gastos.sheetId', cache: 'gastos.cache', tab: 'gastos.tab' };
  // Mismo orden y colores que la pestaña Categorías de la hoja
  const COLORES = ['#4E79A7','#F28E2B','#59A14F','#76B7B2','#E15759','#EDC948','#B07AA1','#FF9DA7','#9C755F','#79706E','#17BECF','#BAB0AC'];
  const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const eur = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });
  const $ = (id) => document.getElementById(id);

  const hoy = new Date();
  const state = { anio: hoy.getFullYear(), mes: hoy.getMonth() + 1, datos: null, cat: null, sel: null };

  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
    del: (k) => { try { localStorage.removeItem(k); } catch {} }
  };

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function color(cat) { const i = state.datos ? state.datos.categorias.indexOf(cat) : -1; return i >= 0 ? COLORES[i % COLORES.length] : '#888'; }
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
  function loading(on) { $('loading').classList.toggle('on', on); }

  async function api(params, post) {
    const url = store.get(K.url), id = store.get(K.id);
    if (!url || !id) throw new Error('Falta la configuración');
    const p = Object.assign({ id }, params);
    let res;
    if (post) {
      // text/plain evita la petición previa CORS que Apps Script no acepta
      res = await fetch(url, { method: 'POST', body: JSON.stringify(p) });
    } else {
      res = await fetch(url + '?' + new URLSearchParams(p).toString());
    }
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'Error del script');
    return j;
  }

  // ---------- Configuración
  function showSetup(editing) {
    $('setup').classList.remove('hidden');
    $('app').classList.add('hidden');
    $('tabbar').classList.add('hidden');
    $('cfgUrl').value = store.get(K.url) || '';
    $('cfgId').value = store.get(K.id) || '';
    $('cfgCancel').classList.toggle('hidden', !editing);
    $('cfgErr').textContent = '';
  }
  function showApp() {
    $('setup').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('tabbar').classList.remove('hidden');
    setTab(store.get(K.tab) || 'resumen');
  }
  function setTab(t) {
    const r = t !== 'movs';
    $('tabResumen').classList.toggle('hidden', !r);
    $('tabMovs').classList.toggle('hidden', r);
    $('tbResumen').classList.toggle('on', r);
    $('tbMovs').classList.toggle('on', !r);
    $('btnAdd').classList.toggle('hidden', r);
    $('btnMic').classList.toggle('hidden', r);
    $('btnReload').classList.toggle('hidden', !r);
    $('title').textContent = r ? 'Resumen' : 'Movimientos';
    store.set(K.tab, r ? 'resumen' : 'movs');
    window.scrollTo(0, 0);
  }
  $('tbResumen').onclick = () => setTab('resumen');
  $('tbMovs').onclick = () => setTab('movs');
  $('cfgSave').onclick = async () => {
    const url = $('cfgUrl').value.trim();
    let id = $('cfgId').value.trim();
    const m = id.match(/\/d\/([a-zA-Z0-9_-]+)/); if (m) id = m[1]; // por si pegas el enlace entero
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { $('cfgErr').textContent = 'La URL tiene que ser la del script (script.google.com/…/exec)'; return; }
    if (!id) { $('cfgErr').textContent = 'Falta el ID de la hoja'; return; }
    const oldUrl = store.get(K.url), oldId = store.get(K.id);
    store.set(K.url, url); store.set(K.id, id);
    $('cfgSave').disabled = true; $('cfgErr').textContent = ''; loading(true);
    try {
      const r = await api({ action: 'ping' });
      store.del(K.cache);
      toast('Conectado a «' + r.nombre + '»');
      showApp(); cargar();
    } catch (e) {
      if (oldUrl) store.set(K.url, oldUrl); else store.del(K.url);
      if (oldId) store.set(K.id, oldId); else store.del(K.id);
      $('cfgErr').textContent = 'No se pudo conectar: ' + e.message;
    } finally { $('cfgSave').disabled = false; loading(false); }
  };
  $('cfgCancel').onclick = showApp;
  $('btnCfg').onclick = () => showSetup(true);

  // ---------- Datos
  function cacheKey() { return state.anio + '-' + state.mes; }
  async function cargar() {
    const cached = JSON.parse(store.get(K.cache) || '{}');
    if (cached[cacheKey()]) { state.datos = cached[cacheKey()]; pintar(); }
    else pintar();
    loading(true);
    try {
      const d = await api({ action: 'datos', anio: state.anio, mes: state.mes });
      state.datos = d; pintar();
      const c = JSON.parse(store.get(K.cache) || '{}'); c[cacheKey()] = d;
      const keys = Object.keys(c); if (keys.length > 6) delete c[keys[0]];
      store.set(K.cache, JSON.stringify(c));
    } catch (e) {
      toast(state.datos ? 'Sin conexión: datos guardados' : 'Error: ' + e.message);
    } finally { loading(false); }
  }

  function pintar() {
    const nombre = new Date(state.anio, state.mes - 1, 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
    $('monthName').textContent = cap(nombre);
    $('yearTitle').textContent = 'Año ' + state.anio;
    const d = state.datos;
    if (!d) { $('movTotal').textContent = ''; $('movCount').textContent = ''; $('yearSub').textContent = ''; $('total').textContent = '–'; $('cats').innerHTML = ''; $('movs').innerHTML = '<div class="empty">Cargando…</div>'; $('chart').innerHTML = ''; $('chartLbls').innerHTML = ''; return; }

    const fila = d.porMes[state.mes - 1] || [];
    const total = fila.reduce((a, b) => a + b, 0);
    $('total').textContent = eur.format(total);
    const nTxt = d.movimientos.length + (d.movimientos.length === 1 ? ' gasto' : ' gastos');
    $('totalSub').textContent = nTxt;
    $('movCount').textContent = nTxt;
    $('movTotal').textContent = eur.format(total);

    // categorías
    const items = d.categorias.map((c, i) => ({ c, v: fila[i] || 0, col: COLORES[i % COLORES.length] }))
      .filter(x => x.v > 0).sort((a, b) => b.v - a.v);
    const max = items.length ? items[0].v : 1;
    $('cats').innerHTML = items.length ? items.map(x => `
      <div class="cat-row">
        <div class="lbl"><span class="dot" style="background:${x.col}"></span>${esc(x.c)}<span class="pct">${(x.v / total * 100).toFixed(1).replace('.', ',')}%</span></div>
        <div class="amt">${eur.format(x.v)}</div>
        <div class="bar"><i style="width:${(x.v / max * 100).toFixed(1)}%;background:${x.col}"></i></div>
      </div>`).join('') : '<div class="empty">Sin gastos este mes</div>';

    // gráfico anual apilado
    const tot = d.porMes.map(r => r.reduce((a, b) => a + b, 0));
    const tmax = Math.max(...tot, 1);
    const conGasto = tot.filter(v => v > 0);
    const totAnio = tot.reduce((a, b) => a + b, 0);
    $('yearSub').textContent = conGasto.length
      ? 'Total ' + state.anio + ': ' + eur.format(totAnio) + ' · media de ' + eur.format(totAnio / conGasto.length) + ' en los meses con gastos'
      : '';
    $('chart').innerHTML = d.porMes.map((r, m) => {
      const segs = r.map((v, i) => v > 0 ? `<div class="seg" style="height:${(v / tmax * 100).toFixed(2)}%;background:${COLORES[i % COLORES.length]}"></div>` : '').join('');
      return `<div class="col ${m === state.mes - 1 ? 'sel' : ''}" data-m="${m + 1}" title="${eur.format(tot[m])}">${segs}</div>`;
    }).join('');
    $('chartLbls').innerHTML = MESES.map((n, m) => `<span class="${m === state.mes - 1 ? 'sel' : ''}">${n[0]}</span>`).join('');
    $('chart').querySelectorAll('.col').forEach(el => el.onclick = () => { state.mes = Number(el.dataset.m); cargar(); });

    // movimientos agrupados por día
    let html = '', dia = '';
    d.movimientos.forEach((mv, i) => {
      if (mv.fecha !== dia) {
        dia = mv.fecha;
        const [y, mo, da] = dia.split('-').map(Number);
        html += `<div class="day">${cap(new Date(y, mo - 1, da).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }))}</div>`;
      }
      const col = color(mv.categoria);
      html += `<div class="mov" data-i="${i}">
        <div class="badge" style="background:${col}">${esc(mv.categoria.slice(0, 2))}</div>
        <div class="info"><div class="c">${esc(mv.concepto)}</div><div class="k">${esc(mv.categoria)}${mv.notas ? ' · ' + esc(mv.notas) : ''}</div></div>
        <div class="a">${eur.format(mv.importe)}</div></div>`;
    });
    $('movs').innerHTML = html || '<div class="empty">Todavía no hay gastos</div>';
    $('movs').querySelectorAll('.mov').forEach(el => el.onclick = () => abrirDetalle(d.movimientos[Number(el.dataset.i)]));
  }

  function moverMes(delta) {
    let m = state.mes + delta, y = state.anio;
    if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
    state.mes = m; state.anio = y; state.datos = null; cargar();
  }
  $('prev').onclick = () => moverMes(-1);
  $('next').onclick = () => moverMes(1);
  $('btnReload').onclick = cargar;

  // ---------- Hojas inferiores
  function abrir(id) { $('sheetBg').classList.add('open'); $(id).classList.add('open'); }
  function cerrar() { $('sheetBg').classList.remove('open'); document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open')); }
  $('sheetBg').onclick = () => { if (rec) { try { rec.onend = null; rec.abort(); } catch {} rec = null; } cerrar(); };

  function fechaHoy() {
    const t = new Date(); const p = (n) => String(n).padStart(2, '0');
    return t.getFullYear() + '-' + p(t.getMonth() + 1) + '-' + p(t.getDate());
  }

  function abrirNuevo(pre) {
    pre = pre || {};
    const cats = state.datos ? state.datos.categorias : [];
    state.cat = null;
    $('fCats').innerHTML = cats.map((c, i) => `<button class="chip" data-c="${esc(c)}" data-col="${COLORES[i % COLORES.length]}"><span class="dot" style="background:${COLORES[i % COLORES.length]}"></span>${esc(c)}</button>`).join('')
      || '<div class="sub">Recarga para ver las categorías</div>';
    $('fCats').querySelectorAll('.chip').forEach(b => b.onclick = () => {
      state.cat = b.dataset.c;
      $('fCats').querySelectorAll('.chip').forEach(x => { x.classList.remove('on'); x.style.background = ''; });
      b.classList.add('on'); b.style.background = b.dataset.col;
    });
    $('fImporte').value = pre.importe ? String(pre.importe).replace('.', ',') : '';
    $('fConcepto').value = pre.concepto || '';
    $('fNotas').value = '';
    $('fFecha').value = pre.fecha || fechaHoy(); $('fErr').textContent = '';
    if (pre.categoria) {
      const b = [...$('fCats').querySelectorAll('.chip')].find(x => x.dataset.c === pre.categoria);
      if (b) b.click();
    }
    $('fAviso').textContent = pre.aviso || '';
    abrir('sheetNew');
    if (!pre.importe) setTimeout(() => $('fImporte').focus(), 250);
  }
  $('btnAdd').onclick = () => abrirNuevo();

  // ---------- Dictado
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, oido = '';
  const norm = (t) => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const PALABRAS = {
    'Vivienda': ['alquiler','hipoteca','comunidad','reparacion','mueble','casa'],
    'Facturas': ['luz','agua','gas','internet','fibra','movil','telefono','seguro','factura','recibo'],
    'Compra': ['mantecados','turron','mercadona','supermercado','lidl','carrefour','dia','aldi','compra','mercado','fruteria','panaderia','drogueria'],
    'Transporte': ['gasolina','gasoil','diesel','parking','aparcamiento','taxi','uber','cabify','bus','autobus','metro','tren','peaje','taller','itv'],
    'Restaurantes': ['restaurante','nestea','refresco','coca','cocacola','cena','comida','almuerzo','desayuno','bar','cafe','cerveza','tapas','freiduria','pizza','burger','hamburguesa','glovo','delivery'],
    'Ocio': ['cine','concierto','padel','pista','futbol','gimnasio','videojuego','juego','libro','copas','copa','loteria','decimo','teatro','entrada','ocio'],
    'Suscripciones': ['suscripcion','netflix','spotify','hbo','disney','amazon prime','prime','icloud','youtube'],
    'Salud': ['farmacia','medico','dentista','optica','fisio','fisioterapeuta','medicina','analisis'],
    'Ropa': ['ropa','zapatos','zapatillas','camiseta','pantalon','camisa','chaqueta','corbata','abrigo'],
    'Impuestos': ['impuesto','irpf','ibi','hacienda','multa','tasa'],
    'Viajes': ['viaje','hotel','vuelo','avion','airbnb','vacaciones','billete'],
    'Otros': ['regalo','otros','varios']
  };
  const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];


  // Convierte números dichos con palabras a cifras: «dieciocho coma veinte» → «18,20»
  const UNID = {cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,
    dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiun:21,veintiuno:21,veintiuna:21,veintidos:22,veintitres:23,veinticuatro:24,
    veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29};
  const DECE = {treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90};
  const CENT = {cien:100,ciento:100,doscientos:200,doscientas:200,trescientos:300,trescientas:300,cuatrocientos:400,cuatrocientas:400,
    quinientos:500,quinientas:500,seiscientos:600,seiscientas:600,setecientos:700,setecientas:700,ochocientos:800,ochocientas:800,novecientos:900,novecientas:900};
  function palabrasANumeros(texto) {
    const toks = texto.split(/\s+/).filter(Boolean);
    const out = [];
    let i = 0;
    while (i < toks.length) {
      const w = norm(toks[i]).replace(/[^a-z0-9]/g, '');
      const esNum = (x) => x in UNID || x in DECE || x in CENT || x === 'mil';
      if (!esNum(w) || ((w === 'un' || w === 'una') && !esNum(norm(toks[i + 1] || '').replace(/[^a-z]/g, '')) && !/^(euro|euros)$/i.test(toks[i + 1] || ''))) {
        out.push(toks[i]); i++; continue;
      }
      if (w === 'cero') { out.push('0'); i++; continue; }
      let total = 0, actual = 0, j = i;
      while (j < toks.length) {
        const x = norm(toks[j]).replace(/[^a-z]/g, '');
        if (x in CENT) { actual += CENT[x]; j++; }
        else if (x in DECE) {
          actual += DECE[x]; j++;
          const y = norm(toks[j] || '').replace(/[^a-z]/g, ''), z = norm(toks[j + 1] || '').replace(/[^a-z]/g, '');
          if (y === 'y' && z in UNID && UNID[z] < 10 && z !== 'cero') { actual += UNID[z]; j += 2; }
        }
        else if (x in UNID && x !== 'cero') { actual += UNID[x]; j++; }
        else if (x === 'mil') { total += (actual || 1) * 1000; actual = 0; j++; }
        else break;
      }
      const sufijo = (toks[j - 1] || '').match(/[,.;:]$/) ? toks[j - 1].slice(-1) : '';
      out.push(String(total + actual) + sufijo);
      i = j;
    }
    let r = out.join(' ');
    r = r.replace(/(\d+)\s+(?:coma|punto)\s+0\s+(\d)\b/gi, '$1,0$2');
    r = r.replace(/(\d+)\s+(?:coma|punto)\s+(\d{1,2})\b/gi, '$1,$2');
    r = r.replace(/(\d+)\s*(?:euros?|€)\s+(\d{1,2})\b(?!\s*(?:de\s+[a-z]))/gi, '$1,$2');
    return r;
  }

  function interpretar(texto) {
    let t = ' ' + palabrasANumeros(texto.trim()) + ' ';
    let n = norm(t);
    const out = {};
    let m;
    const p2 = (x) => String(x).padStart(2, '0');
    const iso = (d) => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
    const quitar = (re) => { t = t.replace(re, ' '); n = norm(t); };

    // fecha
    const hoy = new Date(); hoy.setHours(12, 0, 0, 0);
    if (/\banteayer\b/.test(n)) { const d = new Date(hoy); d.setDate(d.getDate() - 2); out.fecha = iso(d); quitar(/\banteayer\b/i); }
    else if (/\bayer\b/.test(n)) { const d = new Date(hoy); d.setDate(d.getDate() - 1); out.fecha = iso(d); quitar(/\bayer\b/i); }
    else if (/\bhoy\b/.test(n)) { out.fecha = iso(hoy); quitar(/\bhoy\b/i); }
    else {
      m = n.match(/\b(?:el\s+)?(?:dia\s+)?(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\b/);
      if (m) {
        const mes = MESES_L.indexOf(m[2]); let y = hoy.getFullYear();
        if (mes > hoy.getMonth()) y--;
        out.fecha = iso(new Date(y, mes, Number(m[1]), 12));
        quitar(/\b(?:el\s+)?(?:d[ií]a\s+)?\d{1,2}\s+de\s+\S+/i);
      } else {
        m = n.match(/\bel\s+dia\s+(\d{1,2})\b/);
        if (m) {
          const d = new Date(hoy.getFullYear(), hoy.getMonth(), Number(m[1]), 12);
          if (d > hoy) d.setMonth(d.getMonth() - 1);
          out.fecha = iso(d); quitar(/\bel\s+d[ií]a\s+\d{1,2}\b/i);
        }
      }
    }

    // importe: «12,50», «12.5», «12 euros con 50», «12 con 50»
    m = n.match(/(\d+)\s*(?:euros?|€)?\s*con\s*(\d{1,2})\b(?:\s*(?:centimos?|cts?))?/);
    if (m) { out.importe = Number(m[1] + '.' + m[2].padStart(2, '0')); quitar(new RegExp(m[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i')); }
    else {
      m = n.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:euros?|€|pavos)\b/) || n.match(/(\d+(?:[.,]\d{1,2})?)/);
      if (m) { out.importe = Number(m[1].replace(',', '.')); }
    }
    t = t.replace(/(\d+(?:[.,]\d{1,2})?)\s*(?:euros?|€|pavos)\b/i, ' ');
    if (out.importe) t = t.replace(new RegExp('\\b' + String(m && m[1] || '').replace(/[.,]/, '[.,]') + '\\b'), ' ');
    n = norm(t);

    // categoría: nombre exacto o palabras clave
    const cats = state.datos ? state.datos.categorias : Object.keys(PALABRAS);
    let cat = cats.find(c => new RegExp('\\b' + norm(c) + '\\b').test(n));
    if (cat && new RegExp('\\b(?:categoria|en)\\s+' + norm(cat) + '\\b').test(n)) {
      quitar(new RegExp('\\b(?:categor[ií]a\\s+)?' + cat + '\\b', 'i'));
    }
    if (!cat) {
      for (const c of cats) {
        const ws = PALABRAS[c] || [];
        if (ws.some(w => new RegExp('\\b' + w + '\\b').test(n))) { cat = c; break; }
      }
    }
    if (cat) out.categoria = cat;

    // concepto: lo que queda, sin muletillas
    let c = t.replace(/(?<!\S)(he gastado|me he gastado|gast[eé]|pagado|pagu[eé]|apunta|anota|un gasto de|gasto de|gasto)(?!\S)/gi, ' ')
             .replace(/\s+([,.])/g, '$1').replace(/[,.]\s*$/, '').replace(/\s{2,}/g, ' ').trim();
    for (let k = 0; k < 2; k++) {
      c = c.replace(/^(en|de|por|a|el|la|del)\s+/i, '').replace(/\s+(en|de|por|del|a)$/i, '').trim();
    }
    if (c) out.concepto = c.charAt(0).toUpperCase() + c.slice(1);
    return out;
  }

  function terminarDictado(usar) {
    if (rec) { try { rec.onend = null; rec.stop(); } catch {} rec = null; }
    cerrar();
    if (!usar) return;
    const texto = oido.trim();
    if (!texto) { toast('No he oído nada'); return; }
    const pre = interpretar(texto);
    const falta = [];
    if (!pre.importe) falta.push('el importe');
    if (!pre.categoria) falta.push('la categoría');
    pre.aviso = 'Has dicho: «' + texto + '»' + (falta.length ? '. Revisa ' + falta.join(' y ') + '.' : '. Revisa y guarda.');
    setTimeout(() => abrirNuevo(pre), 280);
  }

  $('btnMic').onclick = () => {
    if (!SR) {
      toast('Este navegador no permite dictar aquí. Usa el micro del teclado.');
      abrirNuevo({ aviso: 'Pulsa el micro del teclado para dictar el concepto.' });
      return;
    }
    oido = '';
    $('micText').textContent = 'Escuchando…'; $('micErr').textContent = '';
    abrir('sheetMic');
    rec = new SR();
    rec.lang = 'es-ES'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    rec.onresult = (e) => {
      let fin = '', tmp = '';
      for (let i = 0; i < e.results.length; i++) {
        if (e.results[i].isFinal) fin += e.results[i][0].transcript; else tmp += e.results[i][0].transcript;
      }
      oido = (fin || tmp);
      $('micText').textContent = '«' + (fin + tmp) + '»';
    };
    rec.onerror = (e) => {
      $('micErr').textContent = e.error === 'not-allowed' ? 'Da permiso al micrófono en el navegador y vuelve a probar.'
        : e.error === 'no-speech' ? 'No he oído nada. Prueba otra vez.' : 'Error del micrófono: ' + e.error;
    };
    rec.onend = () => { if (oido.trim()) terminarDictado(true); };
    try { rec.start(); } catch (err) { $('micErr').textContent = 'No se pudo iniciar el micrófono.'; }
  };
  $('micDone').onclick = () => terminarDictado(true);
  $('micCancel').onclick = () => terminarDictado(false);

  function leerImporte(txt) {
    let s = String(txt).replace(/[€\s]/g, '');
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    const n = Number(s);
    return Math.round(n * 100) / 100;
  }

  $('fSave').onclick = async () => {
    const importe = leerImporte($('fImporte').value);
    const concepto = $('fConcepto').value.trim();
    const fecha = $('fFecha').value;
    if (!(importe > 0)) { $('fErr').textContent = 'Escribe un importe'; return; }
    if (!state.cat) { $('fErr').textContent = 'Elige una categoría'; return; }
    if (!concepto) { $('fErr').textContent = 'Escribe un concepto'; return; }
    if (!fecha) { $('fErr').textContent = 'Elige una fecha'; return; }
    $('fSave').disabled = true; $('fErr').textContent = ''; loading(true);
    try {
      await api({ action: 'nuevo', mov: { fecha, categoria: state.cat, concepto, importe, notas: $('fNotas').value.trim() } }, true);
      cerrar(); toast('Gasto guardado');
      const [y, m] = fecha.split('-').map(Number);
      state.anio = y; state.mes = m;
      await cargar();
    } catch (e) { $('fErr').textContent = e.message; }
    finally { $('fSave').disabled = false; loading(false); }
  };

  function abrirDetalle(mv) {
    state.sel = mv;
    $('dTitle').textContent = mv.concepto + ' · ' + eur.format(mv.importe);
    const [y, m, d] = mv.fecha.split('-').map(Number);
    $('dSub').textContent = mv.categoria + ' · ' + new Date(y, m - 1, d).toLocaleDateString('es-ES') + (mv.notas ? ' · ' + mv.notas : '');
    $('dErr').textContent = '';
    abrir('sheetDel');
  }
  $('dClose').onclick = cerrar;
  $('dDelete').onclick = async () => {
    const mv = state.sel; if (!mv) return;
    if (!confirm('¿Borrar «' + mv.concepto + '» de ' + eur.format(mv.importe) + '?')) return;
    $('dDelete').disabled = true; loading(true);
    try {
      await api({ action: 'borrar', fila: mv.fila, concepto: mv.concepto, importe: mv.importe }, true);
      cerrar(); toast('Gasto borrado'); await cargar();
    } catch (e) { $('dErr').textContent = e.message; }
    finally { $('dDelete').disabled = false; loading(false); }
  };

  // ---------- Inicio
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
  if (store.get(K.url) && store.get(K.id)) { showApp(); cargar(); } else { showSetup(false); }
})();
</script>
</body>
